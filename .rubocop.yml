# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

plugins:
  # - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-faker
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 4.0
  DisabledByDefault: false
  DisplayCopNames: true
  NewCops: enable
  Exclude:
    - "**/bin/*"
    - "**/config.ru"
    - "**/db/**/*"
    - "**/schema.rb"
    - "**/node_modules/**/*"
    - "**/vendor/**/*"
    - "**/vendor/**/*.txt"
    - "**/test/**/*"
    - "**/tmp/**/*"
    - config/app_conf.local.rb

Layout/LineLength:
  Exclude:
    - app/views/**/*.rb
  Max: 125

Metrics:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: never

Style/StringLiterals:
  EnforcedStyle: double_quotes

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/LetSetup:
  Enabled: false

RSpec/ContextWording:
  Enabled: true

RSpec/InstanceVariable:
  Enabled: true

RSpec/NestedGroups:
  Enabled: true
  Max: 2

Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: no_space
