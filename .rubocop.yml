# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

plugins:
  # - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-faker
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 4.0
  DisabledByDefault: false
  DisplayCopNames: true
  NewCops: enable
  Exclude:
    - "**/bin/*"
    - "**/config.ru"
    - "**/db/**/*"
    - "**/*schema.rb"
    - "**/node_modules/**/*"
    - "**/vendor/**/*"
    - "**/vendor/**/*.txt"
    - "**/test/**/*"
    - "**/tmp/**/*"
    - config/app_conf.local.rb

Layout/LineLength:
  Exclude:
    - app/views/**/*.rb
  Max: 125

Metrics:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: never

Style/StringLiterals:
  EnforcedStyle: double_quotes

# The RSpec defaults (1 expectation, 5 lines per example) force one example per
# assertion. That reads worse than grouping the assertions that describe a single
# behaviour, so both are relaxed rather than disabled.
# A journey walks one user story through many requests, its steps belong together.
RSpec/ExampleLength:
  Max: 15
  Exclude:
    - "spec/requests/journeys/**/*"

RSpec/MultipleExpectations:
  Max: 5
  Exclude:
    - "spec/requests/journeys/**/*"

# A rake task is described by its name -- there is no class to point the cop at.
RSpec/DescribeClass:
  Exclude:
    - spec/tasks/**/*

# `row` in spec/requests/authorization_matrix_spec.rb defines one example per role,
#   the rest is ActionPolicy's DSL (action_policy/config/rubocop-rspec.yml)
RSpec:
  Language:
    ExampleGroups:
      Regular:
        - describe_rule
    Includes:
      Examples:
        - row
        - succeed
        - failed
