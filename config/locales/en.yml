# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  activerecord:
    attributes:
      user:
        password_challenge: "Current password"
    errors:
      models:
        invitation:
          already_a_member: "%{email} is already a member"
          already_participates: "%{email} already participates in %{project}"
        member:
          last_owner: "%{org} needs at least one active owner"
          guest_owner: "guest cannot own %{projects}, change the project role first"
          guest_without_project: "guest has to participate in a project first"
        participant:
          guest_owner: "owner is not a project role for guests"
  controllers:
    day_locked: "%{date} is locked, unlock the day to change it"
    invitations:
      already_invited: "%{email} is already invited"
      invalid: "That invitation link is invalid or has expired, ask for a new one"
      rate_limited: "Too many invitations, try again later"
      resent: "Sent the invitation to %{email} again"
      revoked: "Revoked the invitation of %{email}"
      sent: "Invited %{email}"
      sign_in_first: "Sign in as %{email} to join %{org}"
      welcome: "Welcome to %{org}"
    members:
      deactivated: "Deactivated %{name}, their entries stay"
      reactivated: "Reactivated %{name}"
      updated: "Updated the role of %{name}"
    projects:
      archived: "Archived %{name}, its entries stay readable"
      created: "Created %{name}"
      renamed: "Renamed %{old_name} to %{name}"
      unarchived: "Unarchived %{name}"
    participants:
      added: "Added %{name} as %{role}"
      removed: "Removed %{name}, their entries stay"
      updated: "%{name} is now %{role}"
    unknown_month: "%{month} is not a month, it has to look like 2026-09"
    unknown_week: "%{week} is not a week, it has to look like 2026-W39"
